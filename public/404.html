<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>

    <script>
      const base = "/portfolio-site";

      const path =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      window.location.replace(
        base +
        "/?redirect=" +
        encodeURIComponent(path),
      );
    </script>
  </head>

  <body></body>
</html>
